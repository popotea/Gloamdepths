<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微光深淵 — 角色動態預覽</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #07111d; color: #b6d9e8; font-family: "Microsoft JhengHei", sans-serif; }
  main { max-width: 960px; margin: auto; }
  header { padding: 22px 24px 12px; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 500; letter-spacing: 3px; }
  p { margin: 0; font-size: 12px; color: #779bac; }
  canvas { display: block; width: 100%; }
  footer { padding: 10px 24px 22px; font-size: 12px; color: #779bac; }
</style>
<main>
  <header><h1>微光深淵 / 角色動態</h1><p>使用遊戲實際的圖格與動畫程式繪製；此預覽不讀寫遊戲進度。</p></header>
  <canvas id="preview" aria-label="待機、行走、衝刺、攻擊、受擊與怪物動態示範"></canvas>
  <footer>四方向行走 · 距離驅動步伐 · 衝刺殘影 · 武器揮動 · 受擊回饋</footer>
</main>
<script src="js/config.js"></script>
<script src="js/texture-pack.js"></script>
<script src="js/animation.js"></script>
<script>
  // 預覽固定使用科技素材,只改本頁記憶體中的選擇。
  texturePackId = 'ruins'; preloadTexturePack();
  const cv = document.getElementById('preview'), ctx = cv.getContext('2d');
  const scale = Math.min(devicePixelRatio || 1, 2);
  cv.width = 960 * scale; cv.height = 540 * scale;
  ctx.scale(scale, scale);
  function worldToScreen(x, y) { return [x * TILE, y * TILE]; }
  const actors = Array.from({length: 6}, (_, i) => ({id:i+1,x:0,y:0,hp:100,maxhp:100,r:0.35,aim:Math.PI/2,swing:0,action:'atk'}));
  const creatures = ['hunter', 'sentinel', 'phantom'].map((type,i) => ({id:20+i,type,x:0,y:0,hp:100}));
  const labels = ['待機與轉向', '四方向行走', '衝刺殘影', '揮擊・挖礦・後座', '受擊回饋', '重裝與漂浮生物'];
  let last = performance.now(), time = 0;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now-last)/1000)); last = now; time += dt;
    ctx.fillStyle = '#07111d'; ctx.fillRect(0,0,960,540);
    for (let i=0;i<6;i++) {
      const ox=(i%3)*320, oy=Math.floor(i/3)*270;
      ctx.fillStyle='#0f2030'; ctx.fillRect(ox+8,oy+8,304,254);
      ctx.strokeStyle='#284654'; ctx.strokeRect(ox+8.5,oy+8.5,303,253);
      ctx.font='15px "Microsoft JhengHei"'; ctx.fillStyle='#a8dae6'; ctx.textAlign='left';
      ctx.fillText(labels[i],ox+24,oy+38);
      ctx.save(); ctx.translate(ox+160,oy+151); ctx.scale(2.2,2.2);
      const p=actors[i]; p.x=p.y=0; p.swing=0; p.dashT=0;
      let held={...ITEMS.iron_sword, ...ITEMS.iron_sword.sword}, id='iron_sword';
      if(i===0) p.aim=Math.floor(time/1.5)%4*Math.PI/2;
      if(i===1) {
        const turn=Math.floor(time/1.2)%4, f=(time%1.2)/1.2;
        const corners=[[-0.5,0.5],[0.5,0.5],[0.5,-0.5],[-0.5,-0.5]];
        const a=corners[turn], b=corners[(turn+1)%4];
        p.x=a[0]+(b[0]-a[0])*f; p.y=a[1]+(b[1]-a[1])*f;
        p.aim=Math.atan2(b[1]-a[1],b[0]-a[0]);
      }
      if(i===2) { p.aim=0; const t=time%1.8; p.x=-1.3+Math.min(t,0.23)*12; p.dashT=t<0.23?0.23-t:0; }
      if(i===3) {
        const mode=Math.floor(time/1.1)%3;
        id=['iron_sword','iron_pick','crossbow'][mode];
        p.action=mode===1?'mine':'atk'; p.aim=-0.3;
        held={...ITEMS[id],...ITEMS[id].sword,ranged:mode===2};
        p.swing=Math.max(0,[0.22,0.2,0.18][mode]-(time%1.1));
      }
      if(i===4) p.hp=Math.floor(time/1.1)%2 ? 90 : 100;
      const state=entityMotion(p,dt,true), image=explorerSprite(state);
      if(i===5) {
        creatures.forEach((e,j)=>{
          e.x=Math.sin(time*1.2)*0.18; e.y=0;
          const state=entityMotion(e,dt);
          const image=packSprite('creatures',PACK_CREATURES[e.type],64);
          if(image) drawEnemyMotion(e,image,state,(j-1)*40,0,j===1?48:34);
        });
      } else if(image) {
        const [x,y]=worldToScreen(p.x,p.y), pose=weaponMotion(p,held,p.r*TILE);
        drawExplorerMotion(p,image,state,x,y,'#79ddeb',pose);
        if(i===3) drawPlayerWeapon(p,held,packItemSprite(id,TILE*0.7),pose,x,y,p.r*TILE);
      }
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</html>
